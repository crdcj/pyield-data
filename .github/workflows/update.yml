name: Atualização DI e Anbima

on:
  schedule:
    # A cada 2 horas (22:17, 00:17, ... BRT), fora do minuto :00, o mais
    # congestionado do GitHub. O script é idempotente e só busca os pregões que
    # faltam: as execuções extras absorvem o atraso do agendador e as falhas
    # das fontes, sem lógica de retentativa.
    - cron: "17 1-23/2 * * *"
  workflow_dispatch:

jobs:
  update-datasets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Download data from Latest Release
        run: gh release download --pattern "*.parquet" --dir release_staging

      - name: Run update script
        id: update
        run: |
          before=$(sha256sum release_staging/*)
          uv run --frozen --no-dev update.py
          [ "$before" = "$(sha256sum release_staging/*)" ] || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        if: steps.update.outputs.changed
        run: |
          TAG="data-$(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          DATE_BR=$(TZ=America/Sao_Paulo date +%d-%m-%Y)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_staging/* --clobber
          else
            gh release create "$TAG" release_staging/* --title "Dados $DATE_BR" --notes "Atualização automática diária." --latest
          fi

      - name: Delete old releases (keep last 30)
        if: steps.update.outputs.changed
        continue-on-error: true
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | \
          tail -n +31 | \
          xargs -I {} gh release delete {} --yes
