name: Verificação de Dados

on:
  schedule:
    # 07:17 BRT, depois das tentativas da madrugada. É o único alarme: fica
    # vermelho enquanto faltar algum pregão dos últimos 5 dias úteis.
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  check-datasets:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Download data from Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download --pattern "*.parquet" --dir release_staging

      - name: Check datasets
        run: uv run --frozen --no-dev check.py
